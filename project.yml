name: Pico
options:
  bundleIdPrefix: com.iamhaseeb
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
targets:
  Pico:
    type: application
    platform: macOS
    sources:
      - path: Pico
        excludes:
          - Resources/Info.plist
          - Resources/Pico.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamhaseeb.Pico
        PRODUCT_NAME: Pico
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Pico/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Pico/Resources/Pico.entitlements
        ENABLE_HARDENED_RUNTIME: false
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Pico/Resources/Info.plist
      properties:
        CFBundleName: Pico
        CFBundleDisplayName: Pico
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSPrincipalClass: NSApplication
  PicoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - PicoTests
    dependencies:
      - target: Pico
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamhaseeb.PicoTests
        GENERATE_INFOPLIST_FILE: true
        MACOSX_DEPLOYMENT_TARGET: "26.0"
schemes:
  Pico:
    build:
      targets:
        Pico: all
        PicoTests: [test]
    test:
      targets:
        - PicoTests
