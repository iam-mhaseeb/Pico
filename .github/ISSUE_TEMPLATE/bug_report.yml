name: Bug report
description: Something is broken or unexpected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Pico. Please search existing issues first.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, including which app was frontmost if relevant.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. 26.0
    validations:
      required: true
  - type: input
    id: pico
    attributes:
      label: Pico version / commit
      placeholder: e.g. 1.0.0 or git SHA
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ask Pico
        - Look / screen actions
        - Text Actions
        - Pet / Ghost Mode
        - History / Settings
        - Hotkeys / permissions
        - Build / CI
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Optional. Avoid pasting personal screen content.
    validations:
      required: false
