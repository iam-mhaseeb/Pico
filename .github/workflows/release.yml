name: Release

# Builds an unsigned Release app and attaches Pico.zip to the GitHub release for
# the pushed tag (for example v1.0.1). Signing and notarization are not done here.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project Pico.xcodeproj \
            -scheme Pico \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify Hardened Runtime is configured
        run: grep -q "ENABLE_HARDENED_RUNTIME = YES" Pico.xcodeproj/project.pbxproj

      - name: Zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/Pico.app Pico.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" Pico.zip --clobber
