<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFEF9"/>
      <stop offset="1" stop-color="#F5EDDC"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <clipPath id="barrelClip"><rect x="150" y="144" width="300" height="288" rx="24"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#6B4A10" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Paper tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#paper)" filter="url(#shadow)"/>
  <g clip-path="url(#tile)">
    <g stroke="#C9DCF2" stroke-width="5">
      <line x1="100" y1="250" x2="924" y2="250"/>
      <line x1="100" y1="326" x2="924" y2="326"/>
      <line x1="100" y1="402" x2="924" y2="402"/>
      <line x1="100" y1="478" x2="924" y2="478"/>
      <line x1="100" y1="554" x2="924" y2="554"/>
      <line x1="100" y1="630" x2="924" y2="630"/>
      <line x1="100" y1="706" x2="924" y2="706"/>
      <line x1="100" y1="782" x2="924" y2="782"/>
      <line x1="100" y1="858" x2="924" y2="858"/>
    </g>
    <line x1="238" y1="100" x2="238" y2="924" stroke="#F2B8B5" stroke-width="5"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#000" stroke-opacity="0.08"/>

  <!-- Sparkles -->
  <path d="M790 196 L804 242 L850 256 L804 270 L790 316 L776 270 L730 256 L776 242 Z" fill="#F28C59"/>
  <path d="M850 340 L857 362 L879 369 L857 376 L850 398 L843 376 L821 369 L843 362 Z" fill="#F7B28F"/>

  <!-- Pico the pencil -->
  <g transform="translate(500 520) rotate(-18) scale(1.08) translate(-300 -300)" filter="url(#soft)">
    <rect x="162" y="30" width="276" height="84" rx="36" fill="#F7999F"/>
    <rect x="150" y="144" width="300" height="288" rx="24" fill="#FCCC40"/>
    <g clip-path="url(#barrelClip)"><rect x="360" y="144" width="90" height="288" fill="#CC8C1F" fill-opacity="0.35"/></g>
    <rect x="150" y="144" width="300" height="288" rx="24" fill="none" stroke="#CC8C1F" stroke-opacity="0.65" stroke-width="6"/>
    <rect x="150" y="102" width="300" height="54" fill="#BDC4D1"/>
    <line x1="150" y1="117" x2="450" y2="117" stroke="#CC8C1F" stroke-opacity="0.45" stroke-width="4"/>
    <line x1="150" y1="135" x2="450" y2="135" stroke="#CC8C1F" stroke-opacity="0.45" stroke-width="4"/>
    <polygon points="150,432 450,432 300,558" fill="#F0CC9E"/>
    <polygon points="246,513 354,513 300,558" fill="#40424D"/>

    <!-- Face -->
    <ellipse cx="240" cy="252" rx="27" ry="36" fill="#2E2924"/>
    <ellipse cx="360" cy="252" rx="27" ry="36" fill="#2E2924"/>
    <ellipse cx="236" cy="252" rx="8" ry="10" fill="#FFFFFF" fill-opacity="0.85" transform="translate(-3 -10)"/>
    <ellipse cx="356" cy="252" rx="8" ry="10" fill="#FFFFFF" fill-opacity="0.85" transform="translate(-3 -10)"/>
    <ellipse cx="190" cy="318" rx="30" ry="19" fill="#FF8085" fill-opacity="0.7"/>
    <ellipse cx="410" cy="318" rx="30" ry="19" fill="#FF8085" fill-opacity="0.7"/>
    <path d="M250 330 Q300 392 350 330" fill="none" stroke="#2E2924" stroke-width="11" stroke-linecap="round"/>

    <!-- Handwriting trail -->
    <path d="M120 584 q 45 -34 90 0 t 90 0 t 90 0 t 90 0" fill="none" stroke="#F28C59" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
